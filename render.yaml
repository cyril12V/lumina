services:
  - type: web
    name: lumina-api
    env: node
    plan: free
    # Le service vit dans backend/ : sans rootDir, Render exécute les commandes
    # à la racine du dépôt et ne trouve ni les dépendances ni dist/index.js.
    rootDir: backend
    # Un seul service sert le site ET l'API, sur la même origine.
    # Le frontend est compilé puis déposé dans backend/public, d'où Express le
    # sert en production (voir src/index.ts).
    #
    # --include=dev est indispensable : Render injecte NODE_ENV=production dès le
    # build, ce qui pousse npm à écarter les devDependencies — dont TypeScript
    # et Vite, nécessaires aux deux compilations.
    buildCommand: >-
      npm ci --include=dev &&
      cd ../frontend && npm ci --include=dev && npm run build &&
      cd ../backend && rm -rf public && cp -r ../frontend/dist public &&
      npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health

    # Pas de disque : sur le plan gratuit le système de fichiers est éphémère.
    # La base SQLite tient en mémoire et est sauvegardée sous forme d'instantané
    # vers un stockage objet externe (voir DATABASE_REMOTE_URL ci-dessous).
    #
    # IMPORTANT : ne jamais passer ce service à plus d'une instance. Deux
    # instances partageraient le même instantané et s'écraseraient mutuellement.
    envVars:
      - key: NODE_ENV
        value: production

      # URL de l'objet contenant l'instantané SQLite, en lecture/écriture.
      # Ex. Supabase Storage :
      #   https://<projet>.supabase.co/storage/v1/object/<bucket>/lumina.db
      - key: DATABASE_REMOTE_URL
        sync: false
      # Jeton porteur associé. Secret : à saisir dans le dashboard Render.
      - key: DATABASE_REMOTE_TOKEN
        sync: false

      # Généré par Render puis conservé : le régénérer invaliderait
      # tous les tokens de session déjà émis.
      - key: JWT_SECRET
        generateValue: true

      # Le site étant servi par ce même service, renseigner ici l'URL Render
      # elle-même (ex. https://lumina-api.onrender.com). Sert aux liens
      # contenus dans les emails. Peut rester vide au premier déploiement.
      - key: FRONTEND_URL
        sync: false
